<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
*{box-sizing:border-box}body{margin:0;background:#181c28;color:#f4f2fa;font-family:system-ui,sans-serif}.tree-shell{max-width:740px;margin:auto;border:1px solid #434456;border-radius:14px;overflow:hidden}header{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;background:#303042}h2{margin:0;font-size:22px}header span{font-size:13px;color:#d6d3e2}nav{display:grid;grid-template-columns:repeat(6,1fr);gap:7px;padding:12px;background:#242534}nav button{min-width:0;border:1px solid var(--color);border-radius:5px;color:var(--color);background:#151824;cursor:pointer;padding:7px 2px;opacity:.62}nav button[aria-selected=true]{background:var(--color);color:#151824;opacity:1;box-shadow:0 0 14px color-mix(in srgb,var(--color) 25%,transparent)}nav b{display:block;font-size:22px}nav small{font-size:10px;font-weight:700}.scene{position:relative;background:radial-gradient(ellipse at 10% 100%,color-mix(in srgb,var(--color) 18%,#151822),#191b27 70%)}.class-title{position:absolute;top:18px;left:20px;pointer-events:none;color:var(--color)}.class-title h3{margin:0;font-size:24px}.class-title p{color:#f4f2fa;margin:5px 0;font-size:13px}svg{display:block;width:100%;height:auto;max-height:580px}path{fill:none;stroke:var(--color);stroke-width:5;opacity:.35}path.active{opacity:1}.node{cursor:pointer;outline:none}.node .frame{fill:#151824;stroke:var(--color);stroke-width:3}.node.selected .frame,.node:focus .frame{stroke:white;stroke-width:5}.node.unused image{opacity:.27}.node.unused .frame{stroke-opacity:.55}.node .level{fill:white;font-size:25px;font-weight:800;stroke:#101018;stroke-width:4;paint-order:stroke;dominant-baseline:middle}.node .change{fill:#f5d269;font-size:22px;font-weight:900;stroke:#171921;stroke-width:3;paint-order:stroke}.details{display:flex;align-items:center;gap:16px;background:#0f111a;padding:18px 20px;border-top:1px solid #444254;min-height:128px}.details img{width:74px;height:74px;border:2px solid var(--color);border-radius:8px}.details h3{font-size:18px;color:var(--color);margin:0 0 6px}.details p{font-size:13px;margin:5px 0;color:#bdc2d2}.details strong{color:white}.details .note{font-size:12px}.legend{padding:10px 20px;font-size:11px;color:#b4bdcf;background:#242534}.legend b{color:#f5d269}@media(max-width:420px){header{padding:12px}h2{font-size:18px}header span{font-size:11px}nav{gap:4px;padding:8px}nav small{font-size:8px}.class-title{top:12px;left:12px}.class-title h3{font-size:18px}.class-title p{font-size:11px}.details{padding:12px;gap:10px}.details img{width:54px;height:54px}.details h3{font-size:15px}.details p{font-size:11px}.details .note{font-size:11px}}
</style></head><body><main class="tree-shell"><header><h2>Optimized Skill Tree</h2><span id="budget"></span></header><nav role="tablist" aria-label="Skill classes"></nav><section class="scene" aria-label="Planned skill allocation"><div class="class-title"><h3 id="class-name"></h3><p id="class-sp"></p></div><svg viewBox="0 0 620 730" role="group" aria-label="Skill nodes"></svg></section><section class="details" aria-live="polite"></section><footer class="legend"><b>↑</b> Increase from imported build · Numbers = optimized levels · Select a skill for details</footer></main><script>
const data=__TREE_DATA__;
const nav=document.querySelector('nav'), svg=document.querySelector('svg'), details=document.querySelector('.details');
let active=0, selected=null;
const fmt=n=>n.toLocaleString();
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
document.querySelector('#budget').textContent=fmt(data.spent)+' / '+fmt(data.total)+' SP';
data.trees.forEach((tree,i)=>{const button=document.createElement('button');button.type='button';button.role='tab';button.style.setProperty('--color',tree.color);button.innerHTML='<b>'+tree.symbol+'</b><small>'+tree.name+'</small>';button.onclick=()=>render(i);nav.append(button)});
function inspect(id){const tree=data.trees[active],node=tree.nodes.find(n=>n.id===id);selected=id;svg.querySelectorAll('.node').forEach(el=>el.classList.toggle('selected',el.dataset.id===id));details.innerHTML='<img src="'+node.icon+'" alt=""><div><h3>'+esc(node.name)+' <strong>Lv. '+node.level+'/'+node.max+'</strong></h3><p>Current '+node.current+' → Planned <strong>'+node.level+'</strong> · '+fmt(node.cost)+' SP total · '+(node.delta>0?'+':'')+fmt(node.delta)+' SP change</p><p class="note">'+esc(node.note)+'</p></div>'}
function render(index){active=index;const tree=data.trees[index];document.querySelector('.tree-shell').style.setProperty('--color',tree.color);Array.from(nav.children).forEach((b,i)=>b.setAttribute('aria-selected',i===index));document.querySelector('#class-name').textContent=tree.name;document.querySelector('#class-sp').textContent=fmt(tree.spent)+' SP allocated';let lines='',nodes='';tree.nodes.forEach(n=>{const parent=tree.nodes.find(p=>p.id===n.parent);if(parent){const mid=parent.y+70;lines+='<path class="'+(n.level>0?'active':'')+'" d="M '+parent.x+' '+parent.y+' V '+mid+' H '+n.x+' V '+n.y+'"/>'}const label=n.name+', optimized level '+n.level+', current '+n.current;nodes+='<g role="button" tabindex="0" aria-label="'+esc(label)+'" data-id="'+n.id+'" class="node '+(n.level?'':'unused')+'"><title>'+esc(label)+'</title><rect class="frame" x="'+(n.x-51)+'" y="'+(n.y-51)+'" width="102" height="102" rx="10"/><image href="'+n.icon+'" x="'+(n.x-46)+'" y="'+(n.y-46)+'" width="92" height="92"/><text class="level" x="'+(n.x+39)+'" y="'+(n.y+36)+'" text-anchor="end">'+n.level+'</text>'+(n.level>n.current?'<text class="change" x="'+(n.x+44)+'" y="'+(n.y-39)+'">↑</text>':'')+'</g>'});svg.innerHTML=lines+nodes;svg.querySelectorAll('.node').forEach(el=>{el.onclick=()=>inspect(el.dataset.id);el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();inspect(el.dataset.id)}}});inspect(tree.nodes[0].id)}
render(data.trees.reduce((best,tree,i)=>tree.spent>data.trees[best].spent?i:best,0));
</script></body></html>
